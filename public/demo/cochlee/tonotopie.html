<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Une fréquence, une place</title>
<style>
  /* Polices locales, chargées en relatif (la balise <base> de la diapositive s'en occupe). */
  @font-face {
    font-family: "Source Sans 3";
    src: url("../polices/SourceSans3-400.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Source Sans 3";
    src: url("../polices/SourceSans3-600.ttf") format("truetype");
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }

  *,
  *::before,
  *::after { box-sizing: border-box; }

  /* Une seule unité de mesure : toute la page suit la taille de la fenêtre. */
  html { font-size: calc(0.66vw + 2.3vh); }
  html, body { height: 100%; }

  body {
    margin: 0;
    overflow: hidden;
    background: #ffffff;
    color: #14171a;
    font-family: "Source Sans 3", system-ui, sans-serif;
    font-size: 0.95rem;
    line-height: 1.25;
    -webkit-font-smoothing: antialiased;
  }

  .carte {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 1.05rem 1.5rem 0.95rem;
    gap: 0.45rem;
  }

  .entete {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    min-height: 1.85rem;
  }

  h1 {
    margin: 0;
    font-size: 1.18rem;
    font-weight: 600;
    letter-spacing: 0.005em;
    color: #14171a;
  }

  button {
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    line-height: 1.15;
    color: #1A3556;
    background: #ffffff;
    border: 1.5px solid #1A3556;
    border-radius: 2px;
    padding: 0.34rem 0.95rem;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: #f1f3f5; }
  button.actif { background: #1A3556; color: #ffffff; }
  button:focus-visible { outline: 2px solid #93b2da; outline-offset: 2px; }

  .zone { position: relative; flex: 1 1 auto; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .bas { flex: 0 0 auto; display: flex; align-items: center; }

  .curseur {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    width: 100%;
  }
  .nom { color: #14171a; white-space: nowrap; }
  .curseur input[type="range"] {
    flex: 1 1 auto;
    min-width: 2rem;
    height: 1.2rem;
    margin: 0;
    padding: 0;
    display: block;
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
    outline: none;   /* pas de cadre de focus rectangulaire sur une diapositive */
  }
  .curseur input[type="range"]::-webkit-slider-runnable-track {
    height: 2px;
    background: #ced4da;
  }
  .curseur input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 0.62rem;
    height: 0.62rem;
    margin-top: calc(-0.31rem + 1px);
    border: 0;
    border-radius: 50%;
    background: #1A3556;
  }
  .curseur input[type="range"]::-moz-range-track { height: 2px; background: #ced4da; }
  .curseur input[type="range"]::-moz-range-thumb {
    width: 0.62rem; height: 0.62rem; border: 0; border-radius: 50%; background: #1A3556;
  }

  .valeur {
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-align: right;
    min-width: 4.3rem;
  }
  .valeur strong { font-weight: 600; }
  .unite { color: #495057; font-weight: 400; margin-left: 0.2rem; }

  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<main class="carte">
  <header class="entete">
    <h1>Une fréquence, une place</h1>
    <button id="ecouter" type="button" aria-pressed="false">Écouter</button>
  </header>

  <div class="zone">
    <canvas id="graphique" role="img"
            aria-label="Déplacement RMS le long de la membrane basilaire, de la base à l'apex, pour cinq fréquences ; le profil sélectionné est mis en évidence."></canvas>
  </div>

  <div class="bas">
    <label class="curseur" for="freq">
      <span class="nom">Fréquence</span>
      <input id="freq" type="range" min="0" max="4" step="1" value="2" aria-valuetext="1000 Hz">
      <output class="valeur" id="valeurFreq" for="freq"><strong>1000</strong><span class="unite">Hz</span></output>
    </label>
    <span class="sr" id="fcTexte" aria-live="polite"></span>
  </div>
</main>

<script>
(function () {
  "use strict";

  var COULEUR = {
    encre: "#14171a",
    secondaire: "#495057",
    filet: "#dee2e6",
    marine: "#1A3556",
    clair: "#93b2da",
    pale: "#ced4da"
  };

  var FREQUENCES = [250, 500, 1000, 2000, 4000];
  // Axe supérieur facultatif : fréquences caractéristiques repères.
  var AXE_FC = [[16000, "16k"], [8000, "8k"], [4000, "4k"], [2000, "2k"],
                [1000, "1k"], [500, "500"], [250, "250"]];

  var toile = document.getElementById("graphique");
  var ctx = toile.getContext("2d");
  var curseur = document.getElementById("freq");
  var sortie = document.getElementById("valeurFreq");
  var bouton = document.getElementById("ecouter");
  var fcTexte = document.getElementById("fcTexte");

  var donnees = null;
  var index = 2;                 // 1000 Hz au départ
  var courbeAffichee = null;     // courbe réellement tracée (interpolée pendant la transition)
  var courbeCible = null;
  var animation = 0;

  var contexteAudio = null;
  var oscillateur = null;
  var gain = null;

  var etat = window.etatWidget = { frequence: FREQUENCES[index], fcHz: null };

  function rem() {
    return parseFloat(getComputedStyle(document.documentElement).fontSize) || 13;
  }
  function police(px, poids) {
    return (poids || 400) + " " + px + 'px "Source Sans 3", system-ui, sans-serif';
  }
  function sommet(courbe) {
    var i = 0;
    for (var k = 1; k < courbe.length; k++) if (courbe[k] > courbe[i]) i = k;
    return i;
  }
  // Format demandé : « 260 Hz » sous 1 kHz, « 1,1 kHz » au-delà (virgule française).
  function formaterFc(f) {
    if (f >= 1000) {
      return "FC ≈ " + (Math.round(f / 100) / 10).toFixed(1).replace(".", ",") + " kHz";
    }
    return "FC ≈ " + (Math.round(f / 10) * 10) + " Hz";
  }

  function majLettreFc() {
    if (!donnees || !courbeCible) return;
    var i = sommet(courbeCible);
    etat.fcHz = donnees.cf_hz[i];
    fcTexte.textContent = formaterFc(etat.fcHz);
  }

  function majSortie() {
    var f = FREQUENCES[index];
    sortie.innerHTML = "<strong>" + f + "</strong><span class=\"unite\">Hz</span>";
    curseur.setAttribute("aria-valuetext", f + " Hz");
    etat.frequence = f;
  }

  // --- Dessin ---------------------------------------------------------------

  function dessiner() {
    if (!donnees || !courbeAffichee) return;

    var l = rem();
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    var rect = toile.getBoundingClientRect();
    var larg = Math.max(1, rect.width);
    var haut = Math.max(1, rect.height);
    if (toile.width !== Math.round(larg * dpr) || toile.height !== Math.round(haut * dpr)) {
      toile.width = Math.round(larg * dpr);
      toile.height = Math.round(haut * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, larg, haut);

    var fsAxe = Math.max(9, haut * 0.045);   // libellés d'axes
    var fsFc = Math.max(10, haut * 0.056);   // étiquette du repère FC

    var margeG = Math.max(l * 2.25, fsAxe * 1.6);
    var margeD = l * 0.45;
    var margeB = fsAxe * 2.15;
    var margeH = fsAxe * 1.6;

    var X0 = margeG, X1 = larg - margeD, Y0 = margeH, Y1 = haut - margeB;
    if (X1 - X0 < 10 || Y1 - Y0 < 10) return;

    var xMin = 0, xMax = 34;
    var rmsMax = 0;
    for (var f = 0; f < FREQUENCES.length; f++) {
      var serie = donnees.rms_m[String(FREQUENCES[f])];
      for (var k = 0; k < serie.length; k++) if (serie[k] > rmsMax) rmsMax = serie[k];
    }
    var yMax = rmsMax * 1.05;

    function px(v) { return X0 + (v - xMin) / (xMax - xMin) * (X1 - X0); }
    function py(v) { return Y1 - (v / yMax) * (Y1 - Y0); }

    var xs = donnees.x_mm;

    // Repères de l'axe supérieur : position où chaque FC est atteinte.
    function positionPourCf(cible) {
      var cf = donnees.cf_hz;
      for (var i = 0; i < cf.length - 1; i++) {
        if (cf[i] >= cible && cf[i + 1] <= cible) {
          var t = (cf[i] - cible) / (cf[i] - cf[i + 1]);
          return xs[i] + t * (xs[i + 1] - xs[i]);
        }
      }
      return null;
    }

    ctx.save();
    ctx.beginPath();
    ctx.rect(X0, Y0 - 1, X1 - X0, Y1 - Y0 + 1);
    ctx.clip();

    // Remplissage clair sous le profil sélectionné.
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = COULEUR.clair;
    ctx.beginPath();
    ctx.moveTo(px(xs[0]), Y1);
    for (var i = 0; i < xs.length; i++) ctx.lineTo(px(xs[i]), py(courbeAffichee[i]));
    ctx.lineTo(px(xs[xs.length - 1]), Y1);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;

    // Les cinq profils en gris pâle, puis le profil sélectionné en marine.
    ctx.lineWidth = 1;
    ctx.strokeStyle = COULEUR.pale;
    ctx.lineJoin = "round";
    for (var j = 0; j < FREQUENCES.length; j++) {
      var c = donnees.rms_m[String(FREQUENCES[j])];
      ctx.beginPath();
      for (var i2 = 0; i2 < xs.length; i2++) {
        var xx = px(xs[i2]), yy = py(c[i2]);
        if (i2 === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
    }

    ctx.lineWidth = 2.5;
    ctx.strokeStyle = COULEUR.marine;
    ctx.beginPath();
    for (var i3 = 0; i3 < xs.length; i3++) {
      var xx2 = px(xs[i3]), yy2 = py(courbeAffichee[i3]);
      if (i3 === 0) ctx.moveTo(xx2, yy2); else ctx.lineTo(xx2, yy2);
    }
    ctx.stroke();

    // Repère vertical pointillé au maximum du profil affiché.
    var iMax = sommet(courbeAffichee);
    var xMaxPx = px(xs[iMax]);
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = COULEUR.marine;
    ctx.lineWidth = 1;
    ctx.setLineDash([Math.max(2, l * 0.22), Math.max(2, l * 0.22)]);
    ctx.beginPath();
    ctx.moveTo(Math.round(xMaxPx) + 0.5, Y0);
    ctx.lineTo(Math.round(xMaxPx) + 0.5, Y1);
    ctx.stroke();
    ctx.restore();

    ctx.restore(); // fin du clip

    // Cadre : ligne de base et axe vertical, filets de 1 px.
    ctx.strokeStyle = COULEUR.filet;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(X0, Y1 + 0.5);
    ctx.lineTo(X1, Y1 + 0.5);
    ctx.moveTo(X0 + 0.5, Y0);
    ctx.lineTo(X0 + 0.5, Y1);
    ctx.stroke();

    // Axe supérieur des FC (discret, libellés omis s'ils se chevauchent).
    ctx.font = police(fsAxe * 0.92, 400);
    ctx.fillStyle = COULEUR.secondaire;
    ctx.textBaseline = "alphabetic";
    var dernierDroit = -Infinity;
    for (var a = 0; a < AXE_FC.length; a++) {
      var pos = positionPourCf(AXE_FC[a][0]);
      if (pos === null) continue;
      var ax = px(pos);
      var texte = AXE_FC[a][1];
      var demi = ctx.measureText(texte).width / 2;
      if (ax - demi < X0 - 1 || ax + demi > X1 + 1) continue;
      if (ax - demi < dernierDroit + fsAxe * 0.55) continue;
      ctx.strokeStyle = COULEUR.filet;
      ctx.beginPath();
      ctx.moveTo(Math.round(ax) + 0.5, Y0);
      ctx.lineTo(Math.round(ax) + 0.5, Y0 - fsAxe * 0.38);
      ctx.stroke();
      ctx.textAlign = "center";
      ctx.fillText(texte, ax, Y0 - fsAxe * 0.55);
      dernierDroit = ax + demi;
    }

    // Libellés de l'axe des distances.
    ctx.font = police(fsAxe, 400);
    ctx.fillStyle = COULEUR.secondaire;
    ctx.textAlign = "left";
    ctx.fillText("Base", X0, Y1 + fsAxe * 1.65);
    ctx.textAlign = "right";
    ctx.fillText("Apex", X1, Y1 + fsAxe * 1.65);
    ctx.strokeStyle = COULEUR.filet;
    ctx.beginPath();
    ctx.moveTo(X0 + 0.5, Y1 + 1);
    ctx.lineTo(X0 + 0.5, Y1 + fsAxe * 0.32);
    ctx.moveTo(X1 - 0.5, Y1 + 1);
    ctx.lineTo(X1 - 0.5, Y1 + fsAxe * 0.32);
    ctx.stroke();

    // Libellé de l'axe des ordonnées.
    ctx.save();
    ctx.translate(l * 0.62, (Y0 + Y1) / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = police(fsAxe, 400);
    ctx.fillStyle = COULEUR.secondaire;
    ctx.fillText("Déplacement RMS", 0, 0);
    ctx.restore();

    // Étiquette du repère FC, au-dessus du tracé, détachée du pointillé.
    var etiquette = fcTexte.textContent;
    if (etiquette) {
      ctx.font = police(fsFc, 600);
      var wEt = ctx.measureText(etiquette).width;
      var ty = Y0 + fsFc * 0.95;
      var tx;
      ctx.textAlign = "left";
      if (xMaxPx + fsFc * 0.55 + wEt <= X1) {
        tx = xMaxPx + fsFc * 0.55;
      } else {
        ctx.textAlign = "right";
        tx = xMaxPx - fsFc * 0.55;
      }
      ctx.lineWidth = fsFc * 0.32;
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#ffffff";
      ctx.strokeText(etiquette, tx, ty);
      ctx.fillStyle = COULEUR.marine;
      ctx.fillText(etiquette, tx, ty);
    }
  }

  function dessinerErreur() {
    var rect = toile.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    toile.width = Math.max(1, Math.round(rect.width * dpr));
    toile.height = Math.max(1, Math.round(rect.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, rect.width, rect.height);
    ctx.font = police(Math.max(10, rect.height * 0.05), 400);
    ctx.fillStyle = COULEUR.secondaire;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("Données indisponibles", rect.width / 2, rect.height / 2);
  }

  // --- Transition de 250 ms entre deux profils ------------------------------

  function changerIndex(n) {
    if (!donnees || n === index) return;
    arreterSon();
    index = n;
    var depart = Float64Array.from(courbeAffichee);
    courbeCible = Float64Array.from(donnees.rms_m[String(FREQUENCES[n])]);
    majSortie();
    majLettreFc();

    cancelAnimationFrame(animation);
    var debut = performance.now();
    function pas(maintenant) {
      var p = Math.min(1, (maintenant - debut) / 250);
      var e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; // easing doux
      for (var i = 0; i < courbeAffichee.length; i++) {
        courbeAffichee[i] = depart[i] + (courbeCible[i] - depart[i]) * e;
      }
      dessiner();
      if (p < 1) animation = requestAnimationFrame(pas);
    }
    animation = requestAnimationFrame(pas);
  }

  // --- Son pur 1 s ----------------------------------------------------------

  function arreterSon() {
    if (!oscillateur || !contexteAudio) return;
    var o = oscillateur, g = gain;
    oscillateur = null;
    gain = null;
    try {
      var t = contexteAudio.currentTime;
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.linearRampToValueAtTime(0, t + 0.02);
      o.stop(t + 0.03);
    } catch (e) { /* déjà arrêté */ }
    bouton.classList.remove("actif");
    bouton.setAttribute("aria-pressed", "false");
  }

  function jouer() {
    if (oscillateur) { arreterSon(); return; }

    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    if (!contexteAudio) contexteAudio = new AudioCtx();
    if (contexteAudio.state === "suspended") contexteAudio.resume();

    var f = FREQUENCES[index];
    var t = contexteAudio.currentTime;
    var o = contexteAudio.createOscillator();
    var g = contexteAudio.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.15, t + 0.02);
    g.gain.setValueAtTime(0.15, t + 1 - 0.02);
    g.gain.linearRampToValueAtTime(0, t + 1);
    o.connect(g);
    g.connect(contexteAudio.destination);
    o.start(t);
    o.stop(t + 1.02);

    oscillateur = o;
    gain = g;
    bouton.classList.add("actif");
    bouton.setAttribute("aria-pressed", "true");

    o.onended = function () {
      if (oscillateur === o) {
        oscillateur = null;
        gain = null;
        bouton.classList.remove("actif");
        bouton.setAttribute("aria-pressed", "false");
      }
    };
  }

  // --- Câblage --------------------------------------------------------------

  curseur.addEventListener("input", function () {
    changerIndex(parseInt(curseur.value, 10));
  });
  bouton.addEventListener("click", jouer);

  function charger() {
    fetch("tonotopie.json")
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (d) {
        donnees = d;
        courbeCible = Float64Array.from(d.rms_m[String(FREQUENCES[index])]);
        courbeAffichee = Float64Array.from(courbeCible);
        majSortie();
        majLettreFc();
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(dessiner);
        }
        dessiner();
      })
      .catch(function (e) {
        dessinerErreur();
        if (window.console) console.warn("tonotopie.json :", e.message);
      });
  }

  if (window.ResizeObserver) {
    new ResizeObserver(function () { dessiner(); }).observe(toile.parentElement);
  }
  window.addEventListener("resize", dessiner);

  majSortie();
  charger();
})();
</script>
</body>
</html>
