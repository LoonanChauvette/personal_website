<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>L'onde voyageuse</title>
<style>
  /* Polices locales, chargées en relatif (la balise <base> de la diapositive s'en occupe). */
  @font-face {
    font-family: "Source Sans 3";
    src: url("../polices/SourceSans3-400.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Source Sans 3";
    src: url("../polices/SourceSans3-600.ttf") format("truetype");
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }

  *,
  *::before,
  *::after { box-sizing: border-box; }

  html { font-size: calc(0.66vw + 2.3vh); }
  html, body { height: 100%; }

  body {
    margin: 0;
    overflow: hidden;
    background: #ffffff;
    color: #14171a;
    font-family: "Source Sans 3", system-ui, sans-serif;
    font-size: 0.95rem;
    line-height: 1.25;
    -webkit-font-smoothing: antialiased;
  }

  .carte {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 1.05rem 1.5rem 0.95rem;
    gap: 0.45rem;
  }

  .entete {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    min-height: 1.85rem;
  }

  h1 {
    margin: 0;
    font-size: 1.18rem;
    font-weight: 600;
    letter-spacing: 0.005em;
    color: #14171a;
  }

  .groupe { display: flex; align-items: baseline; gap: 0.65rem; white-space: nowrap; }

  button {
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    line-height: 1.15;
    color: #1A3556;
    background: #ffffff;
    border: 1.5px solid #1A3556;
    border-radius: 2px;
    padding: 0.34rem 0.95rem;
    cursor: pointer;
    min-width: 4.6rem;
    white-space: nowrap;
  }
  button:hover { background: #f1f3f5; }
  button.actif { background: #1A3556; color: #ffffff; }
  button:focus-visible { outline: 2px solid #93b2da; outline-offset: 2px; }

  .ralenti { font-size: 0.8rem; color: #495057; }

  .zone { position: relative; flex: 1 1 auto; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .bas { flex: 0 0 auto; display: flex; align-items: center; }

  .curseur {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    width: 100%;
  }
  .nom { color: #14171a; white-space: nowrap; }
  .curseur input[type="range"] {
    flex: 1 1 auto;
    min-width: 2rem;
    height: 1.2rem;
    margin: 0;
    padding: 0;
    display: block;
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
    outline: none;   /* pas de cadre de focus rectangulaire sur une diapositive */
  }
  .curseur input[type="range"]::-webkit-slider-runnable-track {
    height: 2px;
    background: #ced4da;
  }
  .curseur input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 0.62rem;
    height: 0.62rem;
    margin-top: calc(-0.31rem + 1px);
    border: 0;
    border-radius: 50%;
    background: #1A3556;
  }
  .curseur input[type="range"]::-moz-range-track { height: 2px; background: #ced4da; }
  .curseur input[type="range"]::-moz-range-thumb {
    width: 0.62rem; height: 0.62rem; border: 0; border-radius: 50%; background: #1A3556;
  }

  .valeur {
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-align: right;
    min-width: 4.3rem;
  }
  .valeur strong { font-weight: 600; }
  .unite { color: #495057; font-weight: 400; margin-left: 0.2rem; }

  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<main class="carte">
  <header class="entete">
    <h1>L'onde voyageuse</h1>
    <div class="groupe">
      <button id="lecture" type="button" aria-pressed="false">Lecture</button>
      <span class="ralenti">ralenti × 1000</span>
    </div>
  </header>

  <div class="zone">
    <canvas id="graphique" role="img"
            aria-label="Déplacement instantané de la membrane basilaire le long de la cochlée, avec l'enveloppe fixe du maximum de déplacement."></canvas>
  </div>

  <div class="bas">
    <label class="curseur" for="temps">
      <span class="nom">Temps</span>
      <input id="temps" type="range" min="5" max="25" step="0.04" value="7.32" aria-valuetext="7,32 ms">
      <output class="valeur" id="valeurTemps" for="temps"><strong>7,32</strong><span class="unite">ms</span></output>
    </label>
    <span class="sr" id="fcTexte" aria-live="polite"></span>
  </div>
</main>

<script>
(function () {
  "use strict";

  var COULEUR = {
    encre: "#14171a",
    secondaire: "#495057",
    filet: "#dee2e6",
    marine: "#1A3556",
    clair: "#93b2da",
    pale: "#ced4da",
    tresPale: "#f1f3f5",
    orange: "#E69F00"
  };

  var DUREE_MIN = 5;    // ms
  var DUREE_MAX = 25;   // ms

  var toile = document.getElementById("graphique");
  var ctx = toile.getContext("2d");
  var curseur = document.getElementById("temps");
  var sortie = document.getElementById("valeurTemps");
  var bouton = document.getElementById("lecture");
  var fcTexte = document.getElementById("fcTexte");

  var donnees = null;
  var xMm = null;
  var cfHz = null;
  var trames = null;      // Float64Array, trames × positions
  var positions = 0;
  var nbTrames = 0;
  var enveloppe = null;   // |y| max sur 5–25 ms, par position
  var echelleY = 1;       // ±1,08 × max de l'enveloppe
  var tMs = 7.32;

  var lecture = false;
  var dernier = null;
  var animation = 0;

  var etat = window.etatWidget = { xMm: null, tMs: tMs };

  function rem() {
    return parseFloat(getComputedStyle(document.documentElement).fontSize) || 13;
  }
  function police(px, poids) {
    return (poids || 400) + " " + px + 'px "Source Sans 3", system-ui, sans-serif';
  }
  function formaterFc(f) {
    if (f >= 1000) {
      return "FC ≈ " + (Math.round(f / 100) / 10).toFixed(1).replace(".", ",") + " kHz";
    }
    return "FC ≈ " + (Math.round(f / 10) * 10) + " Hz";
  }
  function formaterTemps(v) {
    return v.toFixed(2).replace(".", ",");
  }

  // --- Données --------------------------------------------------------------

  function decoder(base64) {
    var binaire = atob(base64);
    var octets = new Uint8Array(binaire.length);
    for (var i = 0; i < binaire.length; i++) octets[i] = binaire.charCodeAt(i);
    var vue = new DataView(octets.buffer);
    var n = octets.length >> 1;
    var sortie = new Float64Array(n);
    for (var k = 0; k < n; k++) sortie[k] = vue.getInt16(k * 2, true);
    return sortie;
  }

  function preparer(d) {
    donnees = d;
    xMm = d.x_mm;
    cfHz = d.cf_hz;
    positions = d.positions;
    nbTrames = d.trames;

    var brut = decoder(d.y_int16_b64);
    var facteur = d.echelle_m / 32767;
    trames = new Float64Array(brut.length);
    for (var i = 0; i < brut.length; i++) trames[i] = brut[i] * facteur;

    // Enveloppe fixe : |y| max entre 5 et 25 ms à chaque position.
    var kDebut = Math.max(0, Math.ceil((0.005 - d.t0_s) * d.fs_hz));
    enveloppe = new Float64Array(positions);
    var maxi = 0;
    for (var p = 0; p < positions; p++) {
      var m = 0;
      for (var k = kDebut; k < nbTrames; k++) {
        var v = Math.abs(trames[k * positions + p]);
        if (v > m) m = v;
      }
      enveloppe[p] = m;
      if (m > maxi) maxi = m;
    }
    echelleY = 1.08 * maxi;

    if (document.fonts && document.fonts.ready) document.fonts.ready.then(dessiner);
    dessiner();
  }

  // Interpolation linéaire entre deux trames.
  function echantillon(t) {
    var tf = (t / 1000 - donnees.t0_s) * donnees.fs_hz;
    if (tf < 0) tf = 0;
    if (tf > nbTrames - 1) tf = nbTrames - 1;
    var k0 = Math.floor(tf);
    var k1 = Math.min(nbTrames - 1, k0 + 1);
    var f = tf - k0;
    var y = new Float64Array(positions);
    var base0 = k0 * positions, base1 = k1 * positions;
    for (var i = 0; i < positions; i++) {
      y[i] = trames[base0 + i] * (1 - f) + trames[base1 + i] * f;
    }
    return y;
  }

  // --- Dessin ---------------------------------------------------------------

  function dessiner() {
    if (!trames || !enveloppe) return;

    var l = rem();
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    var rect = toile.getBoundingClientRect();
    var larg = Math.max(1, rect.width);
    var haut = Math.max(1, rect.height);
    if (toile.width !== Math.round(larg * dpr) || toile.height !== Math.round(haut * dpr)) {
      toile.width = Math.round(larg * dpr);
      toile.height = Math.round(haut * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, larg, haut);

    var fsAxe = Math.max(9, haut * 0.045);
    var fsFc = Math.max(10, haut * 0.056);

    var margeG = l * 0.5;
    var margeD = l * 0.5;
    var margeB = fsAxe * 2.15;
    var margeH = fsAxe * 0.75;

    var X0 = margeG, X1 = larg - margeD, Y0 = margeH, Y1 = haut - margeB;
    if (X1 - X0 < 10 || Y1 - Y0 < 10) return;

    var xMin = 0, xMax = 34;
    function px(v) { return X0 + (v - xMin) / (xMax - xMin) * (X1 - X0); }
    var yZero = (Y0 + Y1) / 2;
    var demi = (Y1 - Y0) / 2 * 0.97;
    function py(v) { return yZero - (v / echelleY) * demi; }

    var y = echantillon(tMs);

    // Position du maximum de |y| : repère orange.
    var iMax = 0;
    for (var i = 1; i < positions; i++) if (Math.abs(y[i]) > Math.abs(y[iMax])) iMax = i;
    etat.xMm = xMm[iMax];
    etat.tMs = tMs;

    // Enveloppe fixe : bande très pâle, contours gris.
    ctx.beginPath();
    ctx.moveTo(px(xMm[0]), py(enveloppe[0]));
    for (var e = 1; e < positions; e++) ctx.lineTo(px(xMm[e]), py(enveloppe[e]));
    for (var e2 = positions - 1; e2 >= 0; e2--) ctx.lineTo(px(xMm[e2]), py(-enveloppe[e2]));
    ctx.closePath();
    ctx.fillStyle = COULEUR.tresPale;
    ctx.fill();

    ctx.strokeStyle = COULEUR.pale;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var e3 = 0; e3 < positions; e3++) {
      var xa = px(xMm[e3]), ya = py(enveloppe[e3]);
      if (e3 === 0) ctx.moveTo(xa, ya); else ctx.lineTo(xa, ya);
    }
    ctx.stroke();
    ctx.beginPath();
    for (var e4 = 0; e4 < positions; e4++) {
      var xb = px(xMm[e4]), yb = py(-enveloppe[e4]);
      if (e4 === 0) ctx.moveTo(xb, yb); else ctx.lineTo(xb, yb);
    }
    ctx.stroke();

    // Ligne de repos.
    ctx.strokeStyle = COULEUR.filet;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(X0, Math.round(yZero) + 0.5);
    ctx.lineTo(X1, Math.round(yZero) + 0.5);
    ctx.stroke();

    // Membrane à l'instant t.
    ctx.strokeStyle = COULEUR.marine;
    ctx.lineWidth = 2.5;
    ctx.lineJoin = "round";
    ctx.beginPath();
    for (var j = 0; j < positions; j++) {
      var xc = px(xMm[j]), yc = py(y[j]);
      if (j === 0) ctx.moveTo(xc, yc); else ctx.lineTo(xc, yc);
    }
    ctx.stroke();

    // Cadre de l'axe des distances.
    ctx.strokeStyle = COULEUR.filet;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(X0, Y1 + 0.5);
    ctx.lineTo(X1, Y1 + 0.5);
    ctx.stroke();

    ctx.font = police(fsAxe, 400);
    ctx.fillStyle = COULEUR.secondaire;
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("Base", X0, Y1 + fsAxe * 1.65);
    ctx.textAlign = "right";
    ctx.fillText("Apex", X1, Y1 + fsAxe * 1.65);
    ctx.strokeStyle = COULEUR.filet;
    ctx.beginPath();
    ctx.moveTo(X0 + 0.5, Y1 + 1);
    ctx.lineTo(X0 + 0.5, Y1 + fsAxe * 0.32);
    ctx.moveTo(X1 - 0.5, Y1 + 1);
    ctx.lineTo(X1 - 0.5, Y1 + fsAxe * 0.32);
    ctx.stroke();

    // Repère orange au maximum de |y|.
    var dx = px(xMm[iMax]);
    var dy = py(y[iMax]);
    var rayon = Math.max(2.2, fsFc * 0.3);
    ctx.beginPath();
    ctx.arc(dx, dy, rayon, 0, Math.PI * 2);
    ctx.fillStyle = COULEUR.orange;
    ctx.fill();

    // Étiquette FC : on retient la position la moins encombrée autour du repère ;
    // si le tracé occupe les quatre coins, elle passe dans la bande libre du haut,
    // à l'aplomb du repère (aucune donnée n'est masquée par le texte).
    var etiquette = formaterFc(cfHz[iMax]);
    fcTexte.textContent = etiquette;
    ctx.font = police(fsFc, 600);
    var wEt = ctx.measureText(etiquette).width;
    var hEt = fsFc;
    var ecart = rayon + fsFc * 0.45;

    function encombrement(xg, base) {
      var xd = xg + wEt;
      var haut = base - hEt * 0.8;
      var bas = base + hEt * 0.2;
      var note = (xg < X0 || xd > X1 || haut < Y0 || bas > Y1) ? 1000 : 0;
      for (var q = 0; q < positions; q++) {
        var qx = px(xMm[q]), qy = py(y[q]);
        if (qx >= xg - 3 && qx <= xd + 3 && qy >= haut - 3 && qy <= bas + 3) note += 1;
      }
      return note;
    }

    var essais = [
      [dx + ecart, dy - ecart],
      [dx - ecart - wEt, dy - ecart],
      [dx + ecart, dy + ecart + hEt],
      [dx - ecart - wEt, dy + ecart + hEt]
    ];
    var choix = essais[0];
    var note = encombrement(essais[0][0], essais[0][1]);
    for (var z = 1; z < essais.length; z++) {
      var noteEssai = encombrement(essais[z][0], essais[z][1]);
      if (noteEssai < note) { note = noteEssai; choix = essais[z]; }
    }
    if (note > 0) {
      var xg = dx + ecart;
      if (xg + wEt > X1) xg = dx - ecart - wEt;
      if (xg < X0) xg = X0;
      choix = [xg, Y0 + hEt * 0.95];
    }

    var tx = choix[0];
    var ty = choix[1];
    ctx.textAlign = "left";
    ctx.lineWidth = fsFc * 0.32;
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#ffffff";
    ctx.strokeText(etiquette, tx, ty);
    ctx.fillStyle = COULEUR.marine;
    ctx.fillText(etiquette, tx, ty);
  }

  // --- Temps et lecture -----------------------------------------------------

  function majSortie() {
    sortie.innerHTML = "<strong>" + formaterTemps(tMs) + "</strong><span class=\"unite\">ms</span>";
    curseur.setAttribute("aria-valuetext", formaterTemps(tMs) + " ms");
    curseur.value = tMs.toFixed(2);
  }

  function fixerTemps(v) {
    tMs = Math.min(DUREE_MAX, Math.max(DUREE_MIN, v));
    majSortie();
    dessiner();
  }

  function boucle(ts) {
    if (!lecture) return;
    if (dernier === null) dernier = ts;
    var dt = Math.min(100, ts - dernier);
    dernier = ts;
    tMs += dt * 0.001;               // ralenti × 1000
    if (tMs > DUREE_MAX) tMs = DUREE_MIN + (tMs - DUREE_MAX) % (DUREE_MAX - DUREE_MIN);
    majSortie();
    dessiner();
    animation = requestAnimationFrame(boucle);
  }

  function basculerLecture() {
    lecture = !lecture;
    if (lecture) {
      dernier = null;
      bouton.textContent = "Pause";
      bouton.classList.add("actif");
      bouton.setAttribute("aria-pressed", "true");
      animation = requestAnimationFrame(boucle);
    } else {
      cancelAnimationFrame(animation);
      bouton.textContent = "Lecture";
      bouton.classList.remove("actif");
      bouton.setAttribute("aria-pressed", "false");
    }
  }

  curseur.addEventListener("input", function () {
    if (lecture) basculerLecture();   // prendre la main sur la lecture
    fixerTemps(parseFloat(curseur.value));
  });
  bouton.addEventListener("click", basculerLecture);

  function charger() {
    fetch("onde.json")
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(preparer)
      .catch(function (e) {
        var rect = toile.getBoundingClientRect();
        var dpr = Math.min(window.devicePixelRatio || 1, 3);
        toile.width = Math.max(1, Math.round(rect.width * dpr));
        toile.height = Math.max(1, Math.round(rect.height * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, rect.width, rect.height);
        ctx.font = police(Math.max(10, rect.height * 0.05), 400);
        ctx.fillStyle = COULEUR.secondaire;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("Données indisponibles", rect.width / 2, rect.height / 2);
        if (window.console) console.warn("onde.json :", e.message);
      });
  }

  if (window.ResizeObserver) {
    new ResizeObserver(function () { dessiner(); }).observe(toile.parentElement);
  }
  window.addEventListener("resize", dessiner);

  majSortie();
  charger();
})();
</script>
</body>
</html>
